plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'maven-publish'
}

// `-Pmc=<version>` selects a target from gradle/versions.properties and fills in the Fabric Loader,
// Fabric API, Mod Menu and Java release that target was built and tested against. Every value stays
// overridable with its own -P flag, and the gradle.properties defaults still apply when the target
// is not listed in the matrix.
def buildMatrix = new Properties()
file('gradle/versions.properties').withInputStream { buildMatrix.load(it) }

// Only an explicit -P on the command line outranks the matrix; the gradle.properties defaults do not.
def commandLineProperties = gradle.startParameter.projectProperties

if (commandLineProperties.containsKey('mc')) {
	project.ext.minecraft_version = commandLineProperties.get('mc').toString()
}

// 1.21.11 is the only 1.x target still maintained. 1.21 through 1.21.10 were archived on
// 2026-09-26 together with the source rewrites they needed; archive/README.md explains how to
// rebuild one from the last commit that still carried them.
if (project.minecraft_version.toString().startsWith('1.') && project.minecraft_version.toString() != '1.21.11') {
	throw new GradleException(
			"Minecraft ${project.minecraft_version} is archived: Crystal Tweaks supports 1.21.11 and later. "
					+ "See archive/README.md to rebuild an archived target.")
}

def matrixEntry = buildMatrix.getProperty(project.minecraft_version.toString())
if (matrixEntry != null) {
	def matrixValues = matrixEntry.split(',').collect { it.trim() }
	[
			loader_version      : matrixValues[0],
			fabric_version      : matrixValues[1],
			modmenu_version     : matrixValues[2],
			java_version        : matrixValues[3]
	].each { key, value ->
		if (!commandLineProperties.containsKey(key)) {
			project.ext.setProperty(key, value)
		}
	}
} else if (commandLineProperties.containsKey('mc')) {
	throw new GradleException(
			"Minecraft ${project.minecraft_version} is not listed in gradle/versions.properties. "
					+ "Add it to the matrix or pass every -P flag explicitly.")
}

// Only 1.21.11 takes this branch now: obfuscated classes remapped from Mojang's names, and the GUI
// and camera-state rewrites below.
def usesRemapping = project.minecraft_version.toString().startsWith("1.")
def usesModernRegistrySplit = project.minecraft_version.toString() in ['26.2', '26.3']
// 26.3 swapped GLFW for SDL and dropped lwjgl-tinyfd with it, renamed the use-item packet's
// accessors to record components, and removed PoseStack.mulPose(Quaternionf).
def usesSdlWindowing = project.minecraft_version.toString() in ['26.3']
apply plugin: usesRemapping ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

def legacyGuiTransform = { String line -> line
		.replace('net.minecraft.client.gui.GuiGraphicsExtractor', 'net.minecraft.client.gui.GuiGraphics')
		.replace('GuiGraphicsExtractor', 'GuiGraphics')
		.replace('extractWidgetRenderState', 'renderWidget')
		.replace('extractContents', 'renderContents')
		.replace('extractDefaultLabel', 'renderDefaultLabel')
		.replace('extractScrollingStringOverContents', 'renderScrollingStringOverContents')
		.replace('extractBackground', 'renderBackground')
		.replace('extractRenderState', 'render')
		.replace('centeredText', 'drawCenteredString')
		.replace('graphics.text(', 'graphics.drawString(')
		.replace('graphics.entity(', 'graphics.submitEntityRenderState(')
		.replace('graphics.fakeItem(', 'graphics.renderFakeItem(')
		.replace('ScreenEvents.afterExtract(', 'ScreenEvents.afterRender(')
		.replace('player.sendSystemMessage(message);', 'player.displayClientMessage(message, false);')
		.replace('this.minecraft.gui.extractDeferredSubtitles();', '')
		// Only 26.1 and 26.2's options screen is told whether it opened from inside a world.
		.replace('new OptionsScreen(this, this.minecraft.options, true)', 'new OptionsScreen(this, this.minecraft.options)') }

// CameraRenderState moved into a `level` subpackage in 26.1; the 1.x targets still use the old one.
def cameraStateTransform = { String line -> line
		.replace(
				'net.minecraft.client.renderer.state.level.CameraRenderState',
				'net.minecraft.client.renderer.state.CameraRenderState')
		.replace(
				'Lnet/minecraft/client/renderer/state/level/CameraRenderState;',
				'Lnet/minecraft/client/renderer/state/CameraRenderState;')
		// 1.21.11's camera state has no projection: the glow's detail falls back to a 70 degree view.
		.replace('Matrix4f projection = camera.projectionMatrix;', 'Matrix4f projection = null;')
		.replace('net.minecraft.client.renderer.state.level.LevelRenderState', 'net.minecraft.client.renderer.state.LevelRenderState')
		.replace('Lnet/minecraft/client/renderer/state/level/LevelRenderState;', 'Lnet/minecraft/client/renderer/state/LevelRenderState;') }

def sdlEraTransform = { String line -> line
		.replace('packet.getHand()', 'packet.hand()')
		.replace('packet.getHitResult()', 'packet.hitResult()')
		.replace('packet.getSequence()', 'packet.sequence()')
		.replace('packet.getEntityIds()', 'packet.entityIds()')
		// 26.3 swings name the animation and whether the swinging player is told too.
		.replace('this.body.swing(InteractionHand.MAIN_HAND);',
				'this.body.swing(InteractionHand.MAIN_HAND, net.minecraft.world.item.component.SwingAnimation.DEFAULT, false);')
		.replace('poses.mulPose(camera.orientation)', 'poses.rotate(camera.orientation)')
		// 26.3 renamed the flag that makes the entity tracker resend a knocked-back entity's motion.
		.replace('target.hurtMarked = false;', 'target.syncVelocity = false;')
		// 26.3's signed chat carries its unsigned text as an Optional.
		.replace('Component content = chat.unsignedContent() != null ? chat.unsignedContent() : Component.literal(chat.body().content());',
				'Component content = chat.unsignedContent().orElseGet(() -> Component.literal(chat.body().content()));')
		// 26.3's model submissions lost the crumbling overlay, their last argument.
		.replace('glowTint, null, 0, null);', 'glowTint, null, 0);')
		// Only 26.1 and 26.2's options screen is told whether it opened from inside a world.
		.replace('new OptionsScreen(this, this.minecraft.options, true)', 'new OptionsScreen(this, this.minecraft.options)')
		// 26.3 moved the texture filters into its new render API and keeps the vanilla pack's files behind fullResources().
		.replace('import com.mojang.blaze3d.textures.FilterMode;', 'import com.mojang.renderpearl.api.textures.FilterMode;')
		.replace('getVanillaPackResources().getResource(', 'getVanillaPackResources().fullResources().getResource(')
		// 26.3's culling check for an entity also takes the partial tick.
		.replace('+ "Lnet/minecraft/client/renderer/culling/Frustum;DDD)Z",', '+ "Lnet/minecraft/client/renderer/culling/Frustum;DDDF)Z",')
		.replace('            double cameraZ,', '            double cameraZ, float partialTick,') }

// 1.21.11's Fabric API draws into the level through WorldRenderEvents, and its attack is an interact
// packet (see src/legacy's LegacyAttacks).
def legacyCoreTransform = { String line -> line
		.replace('net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderContext', 'net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderContext')
		.replace('net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents', 'net.fabricmc.fabric.api.client.rendering.v1.world.WorldRenderEvents')
		.replace('LevelRenderEvents.COLLECT_SUBMITS', 'WorldRenderEvents.AFTER_ENTITIES')
		.replace('LevelRenderContext context', 'WorldRenderContext context')
		.replace('context.levelState()', 'context.worldState()')
		.replace('context.poseStack()', 'context.matrices()')
		.replace('context.submitNodeCollector()', 'context.commandQueue()')
		.replace('import net.minecraft.network.protocol.game.ServerboundAttackPacket;', '')
		.replace('if (!(packet instanceof ServerboundAttackPacket attackPacket)) {', 'if (LegacyAttacks.attacked(packet) < 0) {')
		.replace('int entityId = attackPacket.entityId();', 'int entityId = LegacyAttacks.attacked(packet);') }

// Crystal Practice's Mixins that 1.21.11 goes without: they park a server behind the practice world.
def legacyPracticeMixins = ['PracticePacketMixin', 'PracticeScreenMixin', 'PracticeSoundEngineMixin', 'PracticeParticleMixin',
		'PracticeGameRendererMixin', 'PracticeConnectScreenMixin', 'MinecraftPracticeAccessor', 'BossHealthOverlayAccessor',
		'ClientCommonPacketListenerAccessor']
// The live view of the server behind Crystal Practice needs the world extractor 26.2 brought; 26.3
// renamed the whole rendering API it draws with. Only 26.2 has it (src/modern), the others go without.
def viewPracticeMixins = ['GameRendererPracticeAccessor', 'PracticeViewExtractorMixin']
// 26.3 keeps a totem's activation on the player that popped it, so the parked server's never reaches
// the practice world's screen and this Mixin has nothing to stop there.
def sdlDroppedMixins = ['PracticeGameRendererMixin']

def modernRegistryTransform = { String line -> line
		.replace(
				'import net.minecraft.world.entity.EntityType;',
				'import net.minecraft.world.entity.EntityTypes;')
		.replace('EntityType.END_CRYSTAL', 'EntityTypes.END_CRYSTAL')
		.replace('EntityType.MANNEQUIN', 'EntityTypes.MANNEQUIN')
		.replace('minecraft.screen != null', 'minecraft.gui.screen() != null')
		.replace('minecraft.screen == null', 'minecraft.gui.screen() == null')
		.replace('this.minecraft.gui.extractDeferredSubtitles();', '')
		.replace('this.minecraft.setScreen(', 'this.minecraft.gui.setScreen(')
		.replace('minecraft.setScreen(', 'minecraft.gui.setScreen(')
		.replace('minecraft.getToastManager()', 'minecraft.gui.toastManager()') }

repositories {
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
	}
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"crystal_tweaks" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

if (usesRemapping || usesModernRegistrySplit) {
	def generatedLegacySources = layout.buildDirectory.dir('generated/sources/crystalTweaksLegacy')
	def generateLegacyClientSources = tasks.register('generateLegacyClientSources', Sync) {
		// The `filter` closures below rewrite the shared client sources differently per Minecraft
		// target, and Gradle cannot see inside them. Without these declared inputs the task stays
		// up-to-date across a version switch and the next JAR is built from the previous target's
		// transformed sources.
		inputs.property 'minecraftVersion', project.minecraft_version.toString()
		inputs.property 'usesRemapping', usesRemapping
		inputs.property 'usesModernRegistrySplit', usesModernRegistrySplit
		inputs.property 'usesSdlWindowing', usesSdlWindowing

		from('src/client/java') {
			if (usesModernRegistrySplit || usesRemapping) {
				// 26.2 and 26.3 each bring their own glow materials: vanilla's dragon rays, which the
				// base copy uses, write depth on those targets. 1.21.11 builds the layer material with
				// its older pipeline API.
				exclude 'com/zymekoh/crystaltweaks/client/CrystalGlowMaterial.java'
			}
			if (usesModernRegistrySplit) {
				// 26.2 moved the screen into the GUI: src/gui has Crystal Practice's own way to it.
				exclude 'com/zymekoh/crystaltweaks/client/practice/PracticeGlue.java'
				exclude 'com/zymekoh/crystaltweaks/mixin/client/PracticeScreenMixin.java'
			}
			if (usesModernRegistrySplit && !usesSdlWindowing) {
				// 26.2 draws the live view of the server behind practice: src/modern has it.
				exclude 'com/zymekoh/crystaltweaks/client/practice/ServerView.java'
			}
			if (usesSdlWindowing) {
				exclude 'com/zymekoh/crystaltweaks/client/SoundFilePicker.java'
				sdlDroppedMixins.each { name -> exclude "com/zymekoh/crystaltweaks/mixin/client/${name}.java" }
				filesMatching('**/*.java') {
					filter { line -> sdlEraTransform(line) }
				}
			}
			if (usesRemapping) {
				// 1.21.11 attacks with an interact packet: src/legacy has the benchmark's own hook.
				exclude 'com/zymekoh/crystaltweaks/client/benchmark/AttackHook.java'
				// LevelSettings took a difficulty record and lost its game rules in 26.1.
				exclude 'com/zymekoh/crystaltweaks/client/practice/PracticeLevelSettings.java'
				// No packet queue to share between two worlds: practice leaves the server there, and
				// src/legacy keeps only the practice panel on Escape.
				exclude 'com/zymekoh/crystaltweaks/client/practice/PracticeHost.java'
				exclude 'com/zymekoh/crystaltweaks/client/practice/PracticeGlue.java'
				exclude 'com/zymekoh/crystaltweaks/client/practice/ServerMonitor.java'
				exclude 'com/zymekoh/crystaltweaks/client/practice/ServerWindow.java'
				legacyPracticeMixins.each { name -> exclude "com/zymekoh/crystaltweaks/mixin/client/${name}.java" }
				exclude 'com/zymekoh/crystaltweaks/mixin/client/PracticeMinecraftMixin.java'
			}
			if (usesRemapping) {
				filesMatching(['**/GhostCrystalRenderer.java', '**/core/CrystalAttackOptimizer.java']) {
					filter { line -> legacyCoreTransform(cameraStateTransform(line)) }
				}
				filesMatching(['**/EndCrystalGlowMixin.java', '**/CrystalConverter.java', '**/CrystalGlowRenderer.java', '**/CrystalAfterglow.java', '**/CrystalAfterglowRendererMixin.java', '**/EndCrystalRendererMixin.java']) {
					filter { line -> cameraStateTransform(line) }
				}
			}
			filesMatching([
					'**/ColorPickerWidget.java',
					'**/PurpleCloseButton.java',
					'**/CrystalTweaksScreen.java',
					'**/CrystalUi.java',
					'**/ConflictMonitorScreen.java',
					'**/CrystalPlacementFeedback.java',
					'**/FastPlacement.java',
					// The help in a real fight draws on the HUD and the death screen.
					'**/client/fight/*.java',
					// The settings hub: its screen pieces, widgets and overlays.
					'**/client/hub/*.java',
					// The benchmark and Crystal Practice draw their own screens and HUD and spawn
					// their own entities, so every file there takes the same rewrites.
					'**/client/benchmark/*.java',
					'**/client/practice/*.java',
					'**/practice/*.java'
			]) {
				filter { line ->
					def transformed = usesRemapping ? legacyGuiTransform(line) : line
					if (usesModernRegistrySplit) {
						transformed = modernRegistryTransform(transformed)
					}
					return transformed
				}
			}
		}
		if (usesRemapping) {
			from('src/legacy/java')
		}
		if (usesModernRegistrySplit && !usesSdlWindowing) {
			from('src/modern/java')
		}
		if (usesModernRegistrySplit) {
			from('src/gui/java')
		}
		if (usesSdlWindowing) {
			from('src/sdl/java')
		}
		into generatedLegacySources
	}
	sourceSets.client.java.setSrcDirs([generatedLegacySources])
	tasks.named('compileClientJava').configure {
		dependsOn generateLegacyClientSources
	}
	tasks.matching { it.name == 'sourcesJar' }.configureEach {
		dependsOn generateLegacyClientSources
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (usesRemapping) {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	}
	if (!project.hasProperty("skip_modmenu")) {
		if (usesRemapping) {
			modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
			modRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
		} else {
			compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
			runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
		}
	}

	implementation "javazoom:jlayer:1.0.1"
	include "javazoom:jlayer:1.0.1"
}

if (project.hasProperty("skip_modmenu")) {
	sourceSets.client.java.exclude "com/zymekoh/crystaltweaks/client/CrystalTweaksModMenu.java"
}

def modVersion = project.version
// Every distributable is intentionally tied to exactly one Minecraft version. Modrinth reads this
// value from fabric.mod.json, so accepting an override or a range here would make one JAR appear
// compatible with versions it was never compiled against.
def targetMinecraftDependency = project.minecraft_version.toString()
def targetJavaVersion = (project.findProperty("java_version") ?: "25").toString().toInteger()
def targetModMenuVersion = project.modmenu_version.toString()
def targetLoaderVersion = project.loader_version.toString()

processResources {
	inputs.property "version", modVersion
	inputs.property "minecraft_dependency", targetMinecraftDependency
	inputs.property "java_version", targetJavaVersion
	inputs.property "modmenu_version", targetModMenuVersion
	inputs.property "loader_version", targetLoaderVersion

	filesMatching("fabric.mod.json") {
		// Explicit placeholders keep every JAR metadata entry exact and prevent Modrinth from detecting
		// unrelated Minecraft versions from a broad source range.
		expand(
				version: modVersion,
				minecraft_dependency: targetMinecraftDependency,
				loader_version: targetLoaderVersion,
				java_version: targetJavaVersion,
				modmenu_version: targetModMenuVersion)
	}
}

if (usesRemapping || !usesModernRegistrySplit || usesSdlWindowing) {
	processClientResources {
		// Same reason as generateLegacyClientSources: the filter below rewrites the Mixin config
		// per Minecraft target and Gradle cannot see inside the closure, so the target has to be
		// declared or the task stays up to date across a version switch and ships the previous
		// target's Mixin list.
		inputs.property 'minecraftVersion', project.minecraft_version.toString()
		inputs.property 'droppedMixins', (legacyPracticeMixins + viewPracticeMixins + sdlDroppedMixins).join(',')

		filesMatching('crystal_tweaks.client.mixins.json') {
			filter { line ->
				if (viewPracticeMixins.any { name -> line.contains('"' + name + '",') }) {
					return null
				}
				if (usesSdlWindowing && sdlDroppedMixins.any { name -> line.contains('"' + name + '",') }) {
					return null
				}
				if (!usesRemapping) {
					return line
				}
				if (line.contains('"compatibilityLevel": "JAVA_25"')) {
					return line.replace('JAVA_25', 'JAVA_21')
				}
				if (line.contains('"CrystalAttackPacketMixin",')) {
					// The benchmark reads 1.21.11's attack out of the interact packet.
					return line.concat(System.lineSeparator())
							.concat('    "ServerboundInteractPacketAccessor",')
				}
				if (legacyPracticeMixins.any { name -> line.contains('"' + name + '",') }) {
					return null
				}
				return line
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = targetJavaVersion
}

java {
	withSourcesJar()
	toolchain.languageVersion = JavaLanguageVersion.of(25)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
	from("THIRD_PARTY_NOTICES.md")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
