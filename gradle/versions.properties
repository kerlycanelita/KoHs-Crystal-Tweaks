# Crystal Tweaks build matrix.
#
# One line per supported Minecraft version:
#
#   <minecraft> = <fabric_loader>, <fabric_api>, <mod_menu>, <java_release>
#
# `build.gradle` reads this file, so a release build only needs the Minecraft
# version:
#
#   ./gradlew build -Pmc=26.1.2
#
# Every value is also still overridable one by one with -Ploader_version,
# -Pfabric_version, -Pmodmenu_version and -Pjava_version.
#
# The Fabric Loader entry is the loader the JAR is built and tested against and
# becomes the `depends.fabricloader` floor in the published `fabric.mod.json`.
# Raising it without rebuilding locks players out of the mod.

